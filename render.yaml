# Render Blueprint: deploys the NovaFleet API from this repo.
# In Render: New > Blueprint > pick this repo. Then set the `sync: false`
# secrets in the service's Environment tab.
#
# NOTE: the ML worker is NOT here — Render background workers require a paid
# plan. On the free tier it runs instead as a scheduled GitHub Action
# (.github/workflows/ml-worker.yml), or you can run it locally / add it back
# here as a `type: worker` once on a paid plan.
services:
  - type: web
    name: novafleet-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false # set to your Vercel web URL, e.g. https://novafleet.vercel.app
      - key: SUPABASE_SCHEMA
        value: fleet
      - key: NODE_ENV
        value: production
