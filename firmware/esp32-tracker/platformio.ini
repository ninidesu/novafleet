; NovaFleet ESP32 Tracker (PlatformIO)
; Bench test (Wi-Fi, no SIM/GPS):  pio run -e wifi -t upload
; In-vehicle product (cellular):   pio run -e cellular -t upload
; Monitor:                         pio device monitor

[platformio]
; Default target for the toolbar Build/Upload/Monitor buttons. Change to
; "cellular" when flashing the real in-vehicle unit.
default_envs = wifi

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    vshymanskyy/TinyGSM @ ^0.12.0
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
    bblanchon/ArduinoJson @ ^7.2.0

; Bench testing over Wi-Fi with simulated GPS — bare ESP32 + USB, hits the LAN API.
[env:wifi]
extends = common
build_flags =
    -DUSE_WIFI=1
    -DSIMULATE_GPS=1

; Real in-vehicle unit: A7670C cellular + GNSS.
[env:cellular]
extends = common
build_flags =
    -DUSE_WIFI=0
    ; The A7670C uses the SIMCom A76xx / SIM7600 AT command set in TinyGSM.
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
