<style>
  :root{
    --navy:#0B1F3A; --navy-soft:#12345A; --accent:#2E6BE6; --accent-dim:#EFF5FF;
    --bg:#F5F7FA; --panel:#FFFFFF; --text:#101828; --muted:#64748B; --line:#E4E8F0; --line-soft:#EEF2F7;
    --success:#15803D; --success-bg:#DCFCE7; --danger:#B91C1C; --danger-bg:#FEE2E2;
    --warning:#B45309; --warning-bg:#FEF3C7; --info:#1D4ED8; --info-bg:#DBEAFE;
    --radius:8px; --radius-lg:20px; --shadow:0 18px 46px rgba(15,23,42,.10);
    --font-display:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
    --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#06162b; --panel:#172033; --text:#e5edf8; --muted:#a3b0c2; --line:#334155; --line-soft:#263448; --accent-dim:#16233d; --shadow:0 18px 46px rgba(0,0,0,.45); }
  }
  :root[data-theme="dark"]{ --bg:#06162b; --panel:#172033; --text:#e5edf8; --muted:#a3b0c2; --line:#334155; --line-soft:#263448; --accent-dim:#16233d; --shadow:0 18px 46px rgba(0,0,0,.45); }
  :root[data-theme="light"]{ --bg:#F5F7FA; --panel:#FFFFFF; --text:#101828; --muted:#64748B; --line:#E4E8F0; --line-soft:#EEF2F7; --accent-dim:#EFF5FF; --shadow:0 18px 46px rgba(15,23,42,.10); }

  *{box-sizing:border-box;}
  #dwf{ font-family:var(--font-body); color:var(--text); background:var(--bg); min-height:100%; }
  #dwf button{ font-family:inherit; cursor:pointer; }
  #dwf input,#dwf textarea,#dwf select{ font-family:inherit; }
  #dwf ::selection{ background:var(--accent); color:#fff; }

  .top-strip{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:40; }
  .brand-strip{ display:flex; align-items:center; gap:11px; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:linear-gradient(145deg,var(--navy),#173a66); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:800; font-size:14px; box-shadow:0 6px 16px rgba(11,31,58,.28); }
  .brand-strip-copy{ display:grid; gap:1px; }
  .brand-strip-copy strong{ font-family:var(--font-display); font-size:14.5px; font-weight:750; letter-spacing:-.01em; }
  .brand-strip-copy span{ font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .theme-toggle{ width:36px; height:36px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); display:flex; align-items:center; justify-content:center; }
  .theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }

  .workbench{ display:grid; grid-template-columns:248px minmax(360px,398px) 300px; gap:24px; align-items:start; padding:24px 28px 60px; max-width:1360px; margin:0 auto; }

  /* left rail */
  .nav-rail{ position:sticky; top:82px; display:grid; gap:18px; }
  .nav-group-title{ padding:0 4px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
  .nav-list{ display:grid; gap:2px; margin-top:6px; }
  .nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; }
  .nav-item .n{ width:16px; flex:none; color:var(--muted); font-variant-numeric:tabular-nums; font-size:10.5px; }
  .nav-item:hover{ background:var(--line-soft); color:var(--text); }
  .nav-item.active{ background:var(--accent-dim); border-color:rgba(46,107,230,.28); color:var(--accent); font-weight:750; }
  .nav-item.active .n{ color:var(--accent); }

  /* phone frame */
  .phone-col{ position:sticky; top:82px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .phone-shell{ width:100%; max-width:376px; }
  .phone-frame{ width:100%; aspect-ratio:376/794; border-radius:46px; background:linear-gradient(160deg,#050c1a,#0e1626); padding:12px; box-shadow:var(--shadow), 0 0 0 1px rgba(15,23,42,.06); position:relative; }
  .phone-notch{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:112px; height:22px; background:#050c1a; border-radius:0 0 16px 16px; z-index:5; }
  .phone-screen{ width:100%; height:100%; border-radius:36px; overflow:hidden; background:var(--bg); position:relative; display:flex; flex-direction:column; }
  .status-bar{ flex:none; height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 22px 0 24px; font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--text); background:transparent; position:relative; z-index:4; }
  .status-bar .icons{ display:flex; align-items:center; gap:5px; color:var(--text); }
  .status-bar svg{ width:16px; height:16px; }
  .screen-scroll{ flex:1; min-height:0; overflow-y:auto; -ms-overflow-style:none; scrollbar-width:none; }
  .screen-scroll::-webkit-scrollbar{ display:none; }
  .screen-body{ padding:14px 16px 22px; display:grid; gap:14px; animation:screenIn .22s ease both; }
  @keyframes screenIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .tab-bar{ flex:none; display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); background:var(--panel); padding:8px 4px 12px; }
  .tab-btn{ display:grid; justify-items:center; gap:3px; background:transparent; border:0; color:var(--muted); padding:4px 2px; border-radius:10px; position:relative; }
  .tab-btn svg{ width:20px; height:20px; }
  .tab-btn span{ font-size:9.5px; font-weight:700; }
  .tab-btn.active{ color:var(--accent); }
  .tab-dot{ position:absolute; top:0; right:26%; width:6px; height:6px; border-radius:99px; background:var(--danger); box-shadow:0 0 0 2px var(--panel); }
  .tab-dot.pulse{ background:var(--accent); animation:pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ box-shadow:0 0 0 0 rgba(46,107,230,.4), 0 0 0 2px var(--panel);} 50%{ box-shadow:0 0 0 5px rgba(46,107,230,0), 0 0 0 2px var(--panel);} }

  .back-header{ flex:none; display:flex; align-items:center; gap:10px; padding:6px 14px 12px; }
  .back-btn{ width:32px; height:32px; border:1px solid var(--line); border-radius:9px; background:var(--panel); display:flex; align-items:center; justify-content:center; color:var(--text); flex:none; }
  .back-btn svg{ width:16px; height:16px; }
  .back-header h1{ font-family:var(--font-display); font-size:15px; font-weight:750; }

  /* generic content atoms */
  .k{ font-family:var(--font-display); }
  .eyebrow{ color:var(--accent); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
  .h1{ font-family:var(--font-display); font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .h2{ font-family:var(--font-display); font-size:15px; font-weight:750; }
  .muted{ color:var(--muted); }
  .small{ font-size:11.5px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .card.pad-sm{ padding:11px 12px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stack{ display:grid; gap:8px; }
  .divider{ height:1px; background:var(--line-soft); }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .avatar{ width:38px; height:38px; border-radius:11px; background:linear-gradient(145deg,#EAF1FF,#DCE8FF); color:#1D4ED8; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:13px; flex:none; }
  .icon-box{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .icon-box svg{ width:18px; height:18px; }

  .btn{ display:flex; align-items:center; justify-content:center; gap:7px; width:100%; min-height:44px; border-radius:11px; border:1px solid transparent; font-size:13.5px; font-weight:750; }
  .btn svg{ width:16px; height:16px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:#255bcc; }
  .btn-secondary{ background:var(--panel); border-color:var(--line); color:var(--text); }
  .btn-secondary:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-ghost{ background:var(--line-soft); border-color:transparent; color:var(--text); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-outline-danger{ background:var(--panel); border-color:#F3B4B4; color:var(--danger); }
  .btn-sm{ min-height:38px; font-size:12px; padding:0 10px; width:auto; }
  .btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .link-btn{ background:none; border:0; color:var(--accent); font-size:12.5px; font-weight:700; padding:2px; }

  .field{ display:grid; gap:5px; }
  .field label{ font-size:11.5px; font-weight:700; color:var(--text); }
  .field .hint{ font-size:10.5px; color:var(--muted); font-weight:500; }
  .input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); font-size:13px; }
  .input:focus{ outline:3px solid rgba(46,107,230,.16); border-color:var(--accent); }
  .input-icon-wrap{ position:relative; }
  .input-icon-wrap .input{ padding-left:36px; }
  .input-icon-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); }
  .input-icon-wrap .toggle-eye{ position:absolute; right:9px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); width:26px; height:26px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); font-weight:600; }
  .checkbox-row input{ width:16px; height:16px; accent-color:var(--accent); }

  .list-item{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
  .list-item:last-child{ border-bottom:0; }
  .list-item .lead{ flex:1; min-width:0; display:grid; gap:2px; }
  .list-item .lead strong{ font-size:12.5px; font-weight:700; }
  .list-item .lead span{ font-size:11px; color:var(--muted); }
  .chevron{ color:var(--muted); width:15px; height:15px; flex:none; }

  .banner-stack{ display:grid; gap:6px; padding:0 16px; }
  .banner{ display:flex; align-items:flex-start; gap:8px; padding:9px 11px; border-radius:10px; font-size:11.5px; font-weight:650; line-height:1.35; border:1px solid transparent; }
  .banner svg{ width:15px; height:15px; flex:none; margin-top:1px; }
  .banner.warning{ background:var(--warning-bg); color:var(--warning); }
  .banner.danger{ background:var(--danger-bg); color:var(--danger); }
  .banner.info{ background:var(--info-bg); color:var(--info); }
  .banner.success{ background:var(--success-bg); color:var(--success); }
  .banner .x{ margin-left:auto; background:none; border:0; color:inherit; opacity:.6; width:16px; height:16px; flex:none; }

  .preview-strip{ margin:2px 16px 0; padding:10px 10px 4px; border-top:1px dashed var(--line); }
  .preview-strip .lbl{ font-size:9px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ padding:5px 9px; border-radius:99px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-size:10.5px; font-weight:700; }
  .chip.on{ background:var(--navy); border-color:var(--navy); color:#fff; }

  .map-mock{ height:170px; border-radius:14px; position:relative; overflow:hidden; background:
    linear-gradient(135deg,#EAF2FF,#F7FBFF);
    background-image:linear-gradient(rgba(46,107,230,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(46,107,230,.08) 1px, transparent 1px);
    background-size:22px 22px; border:1px solid var(--line); }
  :root[data-theme="dark"] .map-mock, :root:not([data-theme="light"]) .map-mock{ background-color:#0c1830; }
  @media (prefers-color-scheme:dark){ .map-mock{ background-color:#0c1830; } }
  :root[data-theme="light"] .map-mock{ background-color:#eaf2ff; }
  .map-route{ position:absolute; inset:0; }
  .map-dot{ position:absolute; width:11px; height:11px; border-radius:99px; border:2.5px solid #fff; box-shadow:0 2px 6px rgba(15,23,42,.3); }
  .map-label{ position:absolute; background:rgba(255,255,255,.94); color:#101828; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:5px; }

  .segmented{ display:flex; background:var(--line-soft); border-radius:10px; padding:3px; gap:2px; }
  .segmented button{ flex:1; border:0; background:transparent; padding:7px 4px; border-radius:8px; font-size:11.5px; font-weight:700; color:var(--muted); }
  .segmented button.active{ background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(15,23,42,.12); }

  .tab-scroll{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .tab-scroll::-webkit-scrollbar{ display:none; }
  .tab-scroll button{ flex:none; border:1px solid var(--line); background:var(--panel); color:var(--muted); padding:7px 12px; border-radius:99px; font-size:11.5px; font-weight:700; }
  .tab-scroll button.active{ border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }

  .checklist-item{ display:flex; align-items:flex-start; gap:9px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .checklist-item:last-child{ border:0; }
  .checklist-item .box{ width:19px; height:19px; border-radius:6px; border:2px solid var(--line); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .checklist-item.checked .box{ background:var(--success); border-color:var(--success); }
  .checklist-item .box svg{ width:12px; height:12px; }
  .checklist-item p{ font-size:12px; font-weight:600; line-height:1.4; }

  .upload-slot{ height:76px; border:1.5px dashed var(--line); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:11.5px; font-weight:650; background:var(--line-soft); }
  .upload-slot.filled{ border-style:solid; border-color:var(--success); background:var(--success-bg); color:var(--success); }
  .upload-slot svg{ width:17px; height:17px; }

  .qa-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .qa-btn{ display:grid; justify-items:center; gap:6px; padding:10px 4px; border-radius:13px; border:1px solid var(--line); background:var(--panel); }
  .qa-btn .icon-box{ width:34px; height:34px; }
  .qa-btn span{ font-size:10px; font-weight:700; text-align:center; line-height:1.2; }
  .qa-btn.sos{ border-color:#F3B4B4; }

  .stat-mini{ padding:10px; border:1px solid var(--line-soft); border-radius:10px; display:grid; gap:3px; }
  .stat-mini span{ font-size:9.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .stat-mini strong{ font-family:var(--font-display); font-size:14px; }
  .stat-grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }

  .empty{ padding:40px 14px; text-align:center; display:grid; gap:8px; justify-items:center; }
  .empty .icon-box{ width:48px; height:48px; border-radius:14px; background:var(--line-soft); color:var(--muted); }
  .empty .icon-box svg{ width:22px; height:22px; }
  .empty strong{ font-size:13px; }
  .empty span{ font-size:11.5px; color:var(--muted); max-width:220px; }

  .modal-wrap{ position:absolute; inset:0; z-index:30; display:flex; align-items:flex-end; background:rgba(6,12,24,.5); animation:fadeBg .18s ease both; }
  @keyframes fadeBg{ from{opacity:0;} to{opacity:1;} }
  .sheet{ width:100%; background:var(--panel); border-radius:22px 22px 0 0; padding:18px 18px 26px; display:grid; gap:12px; animation:sheetUp .22s ease both; max-height:88%; overflow-y:auto; }
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:0 auto; }
  .modal-center{ align-items:center; justify-content:center; padding:20px; }
  .dialog{ width:100%; background:var(--panel); border-radius:18px; padding:20px; display:grid; gap:12px; animation:sheetUp .2s ease both; text-align:center; justify-items:center; }

  .toast{ position:absolute; left:16px; right:16px; bottom:96px; z-index:40; display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:12px; background:var(--navy); color:#fff; font-size:12px; font-weight:650; box-shadow:0 12px 28px rgba(0,0,0,.28); animation:toastIn .22s ease both; }
  @keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .toast.success{ background:#0f3b26; }
  .toast.danger{ background:#4a1414; }
  .toast svg{ width:16px; height:16px; flex:none; }

  .sos-hold{ width:150px; height:150px; border-radius:99px; margin:6px auto; position:relative; display:flex; align-items:center; justify-content:center; background:var(--danger-bg); border:2px solid #F3B4B4; }
  .sos-hold .ring{ position:absolute; inset:0; border-radius:99px; }
  .sos-hold strong{ font-family:var(--font-display); font-size:16px; color:var(--danger); position:relative; z-index:1; }
  .sos-hold svg{ width:0; }

  .right-rail{ position:sticky; top:82px; display:grid; gap:14px; }
  .spec-card{ padding:16px; }
  .spec-card h3{ font-family:var(--font-display); font-size:13px; margin-bottom:2px; }
  .spec-card .purpose{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:6px; margin-bottom:12px; }
  .spec-list{ display:grid; gap:7px; margin-top:2px; }
  .spec-list li{ list-style:none; display:flex; gap:7px; font-size:11.5px; line-height:1.45; color:var(--text); }
  .spec-list li:before{ content:"›"; color:var(--accent); font-weight:800; }
  .states-list{ margin-top:10px; display:flex; flex-wrap:wrap; gap:5px; }
  .states-list span{ background:var(--line-soft); color:var(--muted); font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; }

  /* expandable "view details" rows — used to keep the mobile UI concise while
     preserving secondary information (instructions, evidence, full records) */
  #dwf details summary{ list-style:none; cursor:pointer; }
  #dwf details summary::-webkit-details-marker{ display:none; }
  .exp{ padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .exp:last-child{ border-bottom:0; }
  .exp summary{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; font-weight:700; color:var(--text); }
  .exp-caret{ color:var(--accent); font-size:11px; font-weight:700; flex:none; }
  .exp-body{ margin-top:8px; font-size:11.5px; color:var(--muted); line-height:1.55; }
  details.card summary{ display:block; }
  details.card .exp-body{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line-soft); }
  .view-details-toggle{ display:inline-block; }
  .view-details-toggle summary{ display:inline-flex; align-items:center; gap:4px; color:var(--accent); font-size:12px; font-weight:700; }
  .view-details-toggle .exp-body{ margin-top:10px; }

  @media (max-width:1080px){
    .workbench{ grid-template-columns:1fr; }
    .nav-rail{ position:static; grid-auto-flow:column; overflow-x:auto; padding-bottom:4px; }
    .nav-rail .nav-group{ min-width:180px; }
    .phone-col{ position:static; }
    .right-rail{ position:static; }
  }
</style>

<div id="dwf">
  <div class="top-strip">
    <div class="brand-strip">
      <div class="brand-mark">NF</div>
      <div class="brand-strip-copy">
        <strong>NovaFleet Driver</strong>
        <span>Mobile wireframe spec</span>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme"></button>
  </div>

  <div class="workbench">
    <nav class="nav-rail" id="navRail"></nav>

    <div class="phone-col">
      <div class="phone-shell">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="phoneScreen">
            <div class="status-bar">
              <span>9:41</span>
              <span class="icons" id="statusIcons"></span>
            </div>
            <div class="banner-stack" id="bannerStack"></div>
            <div id="flowHeader"></div>
            <div class="screen-scroll"><div class="screen-body" id="screenBody"></div></div>
            <div id="previewStrip"></div>
            <div id="tabBarWrap"></div>
            <div id="overlayWrap"></div>
          </div>
        </div>
      </div>
      <p class="muted small" style="text-align:center;max-width:320px;">Tap the nav list to jump between the 17 screens. Dashed "Preview state" chips inside the phone simulate loading, error, offline and permission states from the spec.</p>
    </div>

    <aside class="right-rail" id="rightRail"></aside>
  </div>
</div>

<script>
(function(){
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');

  const ICONS = {
    home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>',

  // ---------------- helpers ----------------
  function el(id){ return document.getElementById(id); }
  function fmtMoney(n){ return 'KES ' + n.toLocaleString('en-US'); }

  function statusIcons(){
    let s = '';
    s += I('signal');
    s += state.noInternet ? I('wifiOff') : I('wifi');
    s += state.lowBattery ? '<span style="display:flex;align-items:center;">'+I('battery')+'</span>' : I('battery');
    return s;
  }

  function bannerHtml(kind, iconName, text, extra){
    return '<div class="banner '+kind+'">'+I(iconName)+'<span>'+text+(extra||'')+'</span></div>';
  }
  // Short, glanceable banner copy — one line each, using the required tracking vocabulary.
  function banners(){
    if(['splash','login','setup'].includes(state.screen)) return '';
    const list = [];
    if(state.noInternet) list.push(bannerHtml('danger','wifiOff','Offline. Trip still recording.'));
    if(state.gpsDisabled) list.push(bannerHtml('danger','gps','Turn on GPS.'));
    if(state.iotOffline && ['home','activeTrip'].includes(state.screen)) list.push(bannerHtml('warning','alertTriangle','Tracker offline. Use phone GPS.'));
    if(state.bgLocationDisabled) list.push(bannerHtml('danger','mapPin','Allow background GPS.'));
    if(state.lowBattery) list.push(bannerHtml('warning','alertTriangle','Low battery. Charge phone.'));
    if(state.trackingInterrupted) list.push(bannerHtml('danger','alertTriangle','Tracking paused.'));
    if(state.offlineSaving) list.push(bannerHtml('warning','download','Saving offline · 3 queued'));
    if(state.syncing) list.push(bannerHtml('info','refresh','Syncing records…'));
    if(state.routeDeviation && state.screen==='activeTrip') list.push(bannerHtml('danger','route','Off route · 1.4 km'));
    return list.length ? list.join('') : '';
  }

  function previewChip(key,label){
    const on = !!state[key];
    return '<button class="chip '+(on?'on':'')+'" data-toggle="'+key+'">'+label+'</button>';
  }
  function previewStripHtml(){
    const s = state.screen;
    let chips = '';
    if(s==='splash'){
      chips = ['loading','no-internet','update-required','server-unavailable'].map(v=>'<button class="chip '+(state.splashState===v?'on':'')+'" data-splash="'+v+'">'+v.replace('-',' ')+'</button>').join('');
    } else if(s==='login'){
      chips = previewChip('loginError','Invalid login') + previewChip('loginLocked','Too many attempts');
    } else if(s==='setup'){
      chips = '<button class="chip '+(state.setupPermission==='granted'?'on':'')+'" data-setupperm="granted">Permissions granted</button><button class="chip '+(state.setupPermission==='denied'?'on':'')+'" data-setupperm="denied">Permission denied</button>' + previewChip('gpsDisabled','GPS disabled') + (state.setupStep<4 ? '<button class="chip" data-action="setupNext">Next step →</button>' : '');
    } else if(s==='home'){
      chips = previewChip('homeEmpty','No assigned trips') + previewChip('iotOffline','IoT offline') + previewChip('gpsDisabled','GPS disabled');
    } else if(s==='assignments'){
      chips = previewChip('assignEmpty','No assigned trips');
    } else if(s==='activeTrip'){
      chips = previewChip('routeDeviation','Route deviation') + previewChip('gpsDisabled','GPS disabled') + previewChip('lowBattery','Low battery') + previewChip('trackingInterrupted','Tracking interrupted') + previewChip('offlineSaving','Saving offline') + previewChip('syncing','Synchronizing') + previewChip('noInternet','No internet');
    } else if(s==='fuel'){
      chips = previewChip('noInternet','No internet');
    } else if(s==='completeTrip'){
      chips = previewChip('syncing','Pending sync warning');
    } else {
      return '';
    }
    return '<div class="preview-strip"><div class="lbl">Preview state (prototype control)</div><div class="chip-row">'+chips+'</div></div>';
  }

  // ---------------- screen fragments ----------------
  function fSplash(){

    if(state.splashState==='update-required'){
      return splashShell(I('download'),'Update the app to continue.', btn('Update','primary','download'));

      return splashShell(I('alertTriangle'),'Server unavailable. Try again.', btn('Try again','secondary','refresh'));

    return '<div class="stack" style="justify-items:center;text-align:center;padding:70px 10px 10px;">' +

  function fSetup(){
    const steps = ['Confirm account','New password','Register phone','Permissions','Device test'];
    const i = state.setupStep;
    let body = '';
    if(i===0){
      body = '<div class="card pad-sm row"><div class="avatar">BO</div><div class="lead" style="flex:1;"><strong>Brian Otieno</strong><span>DRV-1042 · Kitengela Branch</span></div></div>' +
        '<p class="small muted">Is this your account?</p>' + btn('Confirm','primary');
    } else if(i===1){
      body = '<div class="field"><label>Temporary password</label><input class="input" type="password" value="••••••••" disabled /></div>' +
        '<div class="field"><label>New password</label><input class="input" type="password" placeholder="Min 8 characters" /></div>' +
        '<div class="field"><label>Confirm password</label><input class="input" type="password" placeholder="Re-enter password" /></div>' +
        btn('Set password','primary');
    } else if(i===2){
      body = '<div class="card pad-sm stack">' + row('Device','Pixel 7a') + row('Account','DRV-1042') + '</div>' +
        '<p class="small muted">This phone tracks active trips only.</p>' +
        (state.setupPermission==='denied' ? bannerHtml('danger','xCircle','Registration failed. Try again.') : '') +
        btn('Register phone','primary','idCard');
    } else if(i===3){
      const perms = [['mapPin','Precise location','Track your trip'],['route','Background location','Track while minimized'],['bell','Notifications','Receive trip alerts'],['camera','Camera','Capture receipts']];
      body = '<div class="stack">' + perms.map(p=>'<div class="card pad-sm row"><div class="icon-box" style="background:var(--accent-dim);color:var(--accent);">'+I(p[0])+'</div><div class="lead" style="flex:1;"><strong>'+p[1]+'</strong><span>'+p[2]+'</span></div>'+(state.setupPermission==='denied'?pillOff():pillAllowed())+'</div>').join('') + '</div>' +
        (state.setupPermission==='denied' ? bannerHtml('danger','alertTriangle','Allow permissions to continue.') : '') +
        btn(state.setupPermission==='denied' ? 'Open settings' : 'Continue','primary');
    } else {
      body = '<div class="map-mock"></div>' +
        '<div class="stack">' +
          '<div class="row card pad-sm"><span class="small">GPS</span>'+(state.gpsDisabled?pillOff():'<span class="pill" style="background:var(--success-bg);color:var(--success);">Strong</span>')+'</div>' +

        (state.gpsDisabled ? bannerHtml('danger','gps','Turn on GPS.') : bannerHtml('success','checkCircle','Setup complete.')) +

  function fProfile(){
    return '<div class="stack">' +
      '<div class="card pad-sm row"><div class="avatar" style="width:50px;height:50px;">BO</div><div class="lead" style="flex:1;"><strong>Brian Otieno</strong><span>DRV-1042 · Kitengela Branch</span></div></div>' +
      exp('<span style="display:flex;align-items:center;gap:9px;"><span class="icon-box" style="width:30px;height:30px;background:var(--line-soft);color:var(--text);display:inline-flex;">'+I('idCard')+'</span><strong style="font-size:12.5px;">Personal details</strong></span><span class="exp-caret">View</span>', row('Phone','+254 712 445 210') + row('Account status','<span style="color:var(--success);">Active</span>'), 'exp card pad-sm') +
      settingsRow('phoneIcon','Registered phone', '<span class="small muted">Pixel 7a</span>') +
      settingsRow('lock','Change password') +
      settingsRow('mapPin','Location', state.gpsDisabled ? pillOff() : pillAllowed(), state.gpsDisabled ? 'Allow location in Settings.' : null) +
      settingsRow('route','Background GPS', state.bgLocationDisabled ? pillOff() : pillAllowed(), state.bgLocationDisabled ? 'Allow in Settings.' : null) +
      settingsRow('bell','Notifications', pillAllowed()) +
      settingsRow('camera','Camera', pillAllowed()) +
      settingsRow('refresh','Sync', state.syncing ? badge('Pending') : '<span class="pill" style="background:var(--success-bg);color:var(--success);">Up to date</span>') +
      settingsRow('idCard','Privacy') + settingsRow('idCard','Terms') +
      '<div class="row small muted" style="justify-content:center;">v2.4.1</div>' +
      '<button class="btn btn-outline-danger">'+I('logout')+'Sign out</button>' +
      '</div>';
  }
  function settingsRow(icon,label,right,warn){
    return '<button class="card pad-sm stack" style="text-align:left;width:100%;">' +
      '<div class="row"><div style="display:flex;align-items:center;gap:9px;"><div class="icon-box" style="width:30px;height:30px;background:var(--line-soft);color:var(--text);">'+I(icon)+'</div><strong style="font-size:12.5px;">'+label+'</strong></div>'+(right||I('chevronRight','chevron'))+'</div>' +
      (warn ? '<span class="small" style="color:var(--danger);">'+warn+'</span>' : '') +
      '</button>';
  }

  const RENDERERS = { splash:fSplash, login:fLogin, setup:fSetup, home:fHome, assignments:fAssignments, tripDetails:fTripDetails, pretrip:fPretrip, tracking:fTracking, activeTrip:fActiveTrip, fuel:fFuel, incident:fIncident, sos:fSos, completeTrip:fCompleteTrip, tripSummary:fTripSummary, history:fHistory, notifications:fNotifications, profile:fProfile };

  const TAB_SCREENS = ['home','assignments','fuel','history','profile'];
  const FLOW_BACK = { tripDetails:'assignments', pretrip:'tripDetails', tracking:'pretrip', incident:'activeTrip', sos:'activeTrip', completeTrip:'activeTrip', tripSummary:'home', notifications:'home', setup:'login' };
  // Mobile back-header titles use the shortened driver-facing labels (e.g. "End trip").
  // The left nav rail and right-side spec notes keep the formal screen names, e.g. "Complete Trip".
  const TITLES = { tripDetails:'Trip Details', pretrip:'Checklist', tracking:'Tracking Method', incident:'Report Incident', sos:'SOS', completeTrip:'End trip', tripSummary:'Trip Summary', notifications:'Notifications', setup:'Setup' };

  function render(){
    // nav rail
    el('navRail').innerHTML = NAV.map(g=>'<div class="nav-group"><div class="nav-group-title">'+g.group+'</div><div class="nav-list">' +
      g.items.map(it=>'<button class="nav-item '+(state.screen===it.id?'active':'')+'" data-nav="'+it.id+'"><span class="n">'+it.n+'</span>'+it.label+'</button>').join('') +
      '</div></div>').join('');

    // status icons
    el('statusIcons').innerHTML = statusIcons();

    // theme icon
    themeBtn.innerHTML = I(root.getAttribute('data-theme')==='dark' ? 'eye' : 'eyeOff');

    const isTab = TAB_SCREENS.includes(state.screen) && !(state.screen==='home' && state.tripActive);

    // flow header
    if(state.screen==='home' && state.tripActive){
      el('flowHeader').innerHTML = '<div class="back-header" style="padding-top:2px;"><h1 style="font-family:var(--font-display);font-size:16px;">Active Trip · TRP-58291</h1></div>';
    } else if(!isTab && state.screen!=='splash' && state.screen!=='login'){
      const back = FLOW_BACK[state.screen] || 'home';
      const title = TITLES[state.screen] || '';
      el('flowHeader').innerHTML = '<div class="back-header"><button class="back-btn" data-nav="'+back+'">'+I('back')+'</button><h1>'+title+'</h1></div>';
    } else {
      el('flowHeader').innerHTML = '';
    }

    // banners
    const b = banners();
    el('bannerStack').innerHTML = b;
    el('bannerStack').style.marginTop = b ? '2px' : '0';
    el('bannerStack').style.marginBottom = b ? '2px' : '0';

    // body
    el('screenBody').innerHTML = RENDERERS[state.screen] ? RENDERERS[state.screen]() : '<p>Screen not found</p>';

    // preview strip
    el('previewStrip').innerHTML = previewStripHtml();

    // tab bar
    if(isTab){
      const tabs = [['home','home','Home'],['assignments','assignments','Assignments'],['fuel','fuel','Fuel'],['history','history','History'],['profile','profile','Profile']];
      el('tabBarWrap').innerHTML = '<div class="tab-bar">' + tabs.map(t=>{
        const active = state.screen===t[0];
        const isHomeTrip = t[0]==='home' && state.tripActive;
        return '<button class="tab-btn '+(active?'active':'')+'" data-nav="'+t[0]+'">'+ (isHomeTrip ? '<span class="tab-dot pulse"></span>' : '') +I(t[1])+'<span>'+(isHomeTrip?'Trip':t[2])+'</span></button>';
      }).join('') + '</div>';
    } else {
      el('tabBarWrap').innerHTML = '';
    }

    // overlays
    let overlay = '';
    if(state.completeConfirmOpen){
      overlay = '<div class="modal-wrap modal-center"><div class="dialog">' +
        '<div class="icon-box" style="width:48px;height:48px;border-radius:14px;background:var(--warning-bg);color:var(--warning);">'+I('alertTriangle')+'</div>' +
        '<div class="h2">End this trip?</div>' +
        '<span class="small muted">Tracking will stop.</span>' +
        '<div class="btn-row" style="width:100%;"><button class="btn btn-secondary" data-action="closeCompleteConfirm">Cancel</button><button class="btn btn-primary" data-action="confirmComplete">End trip</button></div>' +
        '</div></div>';
    } else if(state.toast){
      const t = state.toast;
      overlay = '<div class="toast '+t.kind+'">'+I(t.icon)+'<span>'+t.text+'</span></div>';
    }
    el('overlayWrap').innerHTML = overlay;

    // right rail spec notes (kept detailed for reviewers)
    const spec = SPEC[state.screen];
    if(spec){
      el('rightRail').innerHTML = '<div class="card spec-card">' +
        '<span class="eyebrow">Spec notes</span>' +
        '<h3>'+(NAV.flatMap(g=>g.items).find(i=>i.id===state.screen)||{}).label+'</h3>' +
        '<p class="purpose">'+spec.purpose+'</p>' +
        '<strong class="small">Functions</strong>' +
        '<ul class="spec-list">'+spec.fns.map(f=>'<li>'+f+'</li>').join('')+'</ul>' +
        (spec.states ? '<strong class="small" style="display:block;margin-top:12px;">Possible states</strong><div class="states-list">'+spec.states.map(s=>'<span>'+s+'</span>').join('')+'</div>' : '') +
        '</div>';
    } else {
      el('rightRail').innerHTML = '';
    }
  }

  // ---------------- interactions ----------------
  let sosTimer = null, sosProgress = 0;
  document.addEventListener('click', function(e){
    const t = e.target.closest('[data-nav],[data-tab],[data-toggle],[data-splash],[data-setupperm],[data-assigntab],[data-fueltab],[data-historytab],[data-track],[data-action]');
    if(!t) return;
    if(t.hasAttribute('data-nav')){ state.screen = t.getAttribute('data-nav'); state.completeConfirmOpen=false; window.scrollTo(0,document.getElementById('dwf').offsetTop); render(); return; }
    if(t.hasAttribute('data-tab')){ state.screen = t.getAttribute('data-tab'); render(); return; }
    if(t.hasAttribute('data-toggle')){ const k=t.getAttribute('data-toggle'); state[k] = !state[k]; render(); return; }
    if(t.hasAttribute('data-splash')){ state.splashState = t.getAttribute('data-splash'); render(); return; }
    if(t.hasAttribute('data-setupperm')){ state.setupPermission = t.getAttribute('data-setupperm'); render(); return; }
    if(t.hasAttribute('data-assigntab')){ state.assignTab = t.getAttribute('data-assigntab'); render(); return; }
    if(t.hasAttribute('data-fueltab')){ state.fuelTab = t.getAttribute('data-fueltab'); render(); return; }
    if(t.hasAttribute('data-historytab')){ state.historyTab = t.getAttribute('data-historytab'); render(); return; }
    if(t.hasAttribute('data-track')){ if(t.disabled) return; state.trackingMethod = t.getAttribute('data-track'); render(); return; }
    if(t.hasAttribute('data-action')){
      const a = t.getAttribute('data-action');
      if(a==='setupNext'){ e.preventDefault(); state.setupStep = Math.min(4, state.setupStep+1); render(); }
      if(a==='refresh'){ render(); }
      if(a==='startTrip'){ state.tripActive = true; state.screen='home'; render(); }
      if(a==='submitFuel'){ state.fuelSubmitted = true; showToast('success','checkCircle','Fuel record submitted.'); render(); }
      if(a==='submitIncident'){ state.incidentSubmitted = true; showToast('success','checkCircle','Incident sent.'); render(); }
      if(a==='openCompleteConfirm'){ state.completeConfirmOpen = true; render(); }
      if(a==='closeCompleteConfirm'){ state.completeConfirmOpen = false; render(); }
      if(a==='confirmComplete'){ state.completeConfirmOpen=false; state.tripActive=false; state.fuelSubmitted=false; state.incidentSubmitted=false; state.trackingMethod=null; state.screen='tripSummary'; render(); }
      return;
    }
  });

  function showToast(kind,icon,text){ state.toast = {kind,icon,text}; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }

  document.addEventListener('mousedown', function(e){
    const t = e.target.closest('#sosHold');
    if(!t) return; startSos(t);
  });
  document.addEventListener('touchstart', function(e){
    const t = e.target.closest('#sosHold');
    if(!t) return; startSos(t);
  }, {passive:true});
  ['mouseup','mouseleave','touchend'].forEach(evt=>document.addEventListener(evt, cancelSos));
  function startSos(node){
    sosProgress = 0;
    node.style.transition = 'none';
    sosTimer = setInterval(()=>{
      sosProgress += 4;
      node.style.background = 'conic-gradient(var(--danger) '+sosProgress*3.6+'%, var(--danger-bg) 0)';
      if(sosProgress>=100){ clearInterval(sosTimer); state.sosConfirmed = true; render(); }
    }, 45);
  }
  function cancelSos(){ if(sosTimer){ clearInterval(sosTimer); sosTimer=null; } }

  themeBtn.addEventListener('click', function(){
    const cur = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', cur);
    render();
  });

  render();
})();
</script>
