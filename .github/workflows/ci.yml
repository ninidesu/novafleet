name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Placeholders — real values are injected at deploy time (Vercel).
          VITE_API_URL: /api
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-placeholder

  api:
    name: API check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check all source
        run: node --check src/index.js && find src -name "*.js" -print0 | xargs -0 -n1 node --check

  worker:
    name: ML worker check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile src/*.py
